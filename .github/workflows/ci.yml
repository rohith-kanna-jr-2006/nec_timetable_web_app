name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  web:
    name: Web Frontend Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: npm install

      - name: Run Web Test Suite
        run: npm test

      - name: Build Web Application
        run: npm run build

  backend:
    name: Backend API & Integration Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: npm install

      - name: Populate Seed Database
        run: npm run seed
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/nec_faculty_db
          JWT_SECRET: ci_test_secret_key_12345
          NODE_ENV: test

      - name: Run Backend Test Suite
        run: npm test
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/nec_faculty_db
          JWT_SECRET: ci_test_secret_key_12345
          NODE_ENV: test

